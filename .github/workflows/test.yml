name: Test

on:
  push:
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: node --check admin/admin.js
